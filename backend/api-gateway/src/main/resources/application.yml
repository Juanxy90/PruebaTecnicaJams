server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

gateway:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  car-service-url: ${CAR_SERVICE_URL:http://localhost:8082}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
